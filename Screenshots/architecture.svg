<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 600" width="860" height="600" font-family="Menlo, Monaco, monospace">
  <rect width="860" height="600" fill="#1e1e2e"/>
  <defs><marker id="arw" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#89b4fa"/></marker><marker id="arwG" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#a6e3a1"/></marker><marker id="arwR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#f38ba8"/></marker><marker id="arwP" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#cba6f7"/></marker></defs>
  <text x="430" y="40" font-size="20" fill="#f5f5f5" text-anchor="middle" font-weight="bold" font-family="Menlo, Monaco, monospace">OutputRepairKit &#8212; the bounded self-healing repair loop</text>
  <rect x="40" y="64" width="560" height="500" rx="12" fill="#181825" stroke="#45475a" stroke-width="2"/>
  <text x="60" y="88" font-size="12" fill="#9399b2" text-anchor="start" font-family="Menlo, Monaco, monospace">OutputRepairLoop  (actor)   ·   RepairPolicy · RepairStats · RepairBackoff</text>
  <rect x="160" y="104" width="180" height="30" rx="15" fill="#232634" stroke="#89b4fa" stroke-width="2"/>
  <text x="250" y="124" font-size="12" fill="#89b4fa" text-anchor="middle" font-family="Menlo, Monaco, monospace">initialPrompt : String</text>
  <rect x="100" y="158" width="300" height="50" rx="8" fill="#241e2b" stroke="#cba6f7" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="250" y="180" font-size="12.5" fill="#cba6f7" text-anchor="middle" font-weight="bold" font-family="Menlo, Monaco, monospace">producer.produce(prompt)</text>
  <text x="250" y="197" font-size="10" fill="#9399b2" text-anchor="middle" font-family="Menlo, Monaco, monospace">ResponseProducing → ProviderGatewayKit LLMSession</text>
  <rect x="100" y="232" width="300" height="50" rx="8" fill="#1e262b" stroke="#89dceb" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="250" y="254" font-size="12.5" fill="#89dceb" text-anchor="middle" font-weight="bold" font-family="Menlo, Monaco, monospace">contract.validate(raw)</text>
  <text x="250" y="271" font-size="10" fill="#9399b2" text-anchor="middle" font-family="Menlo, Monaco, monospace">OutputContract → StructuredOutputKit decoder</text>
  <text x="250" y="304" font-size="12" fill="#f9e2af" text-anchor="middle" font-family="Menlo, Monaco, monospace">valid ?</text>
  <rect x="100" y="318" width="300" height="48" rx="8" fill="#2b2620" stroke="#f9b366" stroke-width="2"/>
  <text x="250" y="338" font-size="12" fill="#f9b366" text-anchor="middle" font-weight="bold" font-family="Menlo, Monaco, monospace">[RepairIssue]  —  structured feedback</text>
  <text x="250" y="354" font-size="10" fill="#9399b2" text-anchor="middle" font-family="Menlo, Monaco, monospace">path · problem · expected · observed</text>
  <text x="250" y="390" font-size="12" fill="#f9e2af" text-anchor="middle" font-family="Menlo, Monaco, monospace">attempts &lt; maxAttempts ?</text>
  <rect x="100" y="404" width="300" height="50" rx="8" fill="#241e2b" stroke="#cba6f7" stroke-width="2"/>
  <text x="250" y="426" font-size="12" fill="#cba6f7" text-anchor="middle" font-weight="bold" font-family="Menlo, Monaco, monospace">backoff.delay → prompter.repairPrompt()</text>
  <text x="250" y="443" font-size="10" fill="#9399b2" text-anchor="middle" font-family="Menlo, Monaco, monospace">re-prompt with what was wrong</text>
  <line x1="250" y1="134" x2="250" y2="156" stroke="#89b4fa" stroke-width="2" marker-end="url(#arw)"/>
  <line x1="250" y1="208" x2="250" y2="230" stroke="#89b4fa" stroke-width="2" marker-end="url(#arw)"/>
  <line x1="250" y1="282" x2="250" y2="316" stroke="#89b4fa" stroke-width="2" marker-end="url(#arw)"/>
  <line x1="250" y1="366" x2="250" y2="402" stroke="#89b4fa" stroke-width="2" marker-end="url(#arw)"/>
  <path d="M 100 429 L 90 429 L 90 183 L 100 183" fill="none" stroke="#cba6f7" stroke-width="2" marker-end="url(#arwP)"/>
  <text x="96" y="306" font-size="10" fill="#cba6f7" text-anchor="start" font-family="Menlo, Monaco, monospace">repair loop</text>
  <rect x="640" y="232" width="190" height="58" rx="8" fill="#1e2b23" stroke="#a6e3a1" stroke-width="2"/>
  <text x="735" y="258" font-size="12.5" fill="#a6e3a1" text-anchor="middle" font-weight="bold" font-family="Menlo, Monaco, monospace">RepairRun&lt;Output&gt;</text>
  <text x="735" y="276" font-size="10" fill="#9399b2" text-anchor="middle" font-family="Menlo, Monaco, monospace">output · attempts · history</text>
  <path d="M 400 257 L 640 261" fill="none" stroke="#a6e3a1" stroke-width="2" marker-end="url(#arwG)"/>
  <text x="520" y="250" font-size="10" fill="#a6e3a1" text-anchor="middle" font-family="Menlo, Monaco, monospace">valid</text>
  <rect x="640" y="404" width="190" height="50" rx="8" fill="#2b1e22" stroke="#f38ba8" stroke-width="2"/>
  <text x="735" y="433" font-size="11.5" fill="#f38ba8" text-anchor="middle" font-weight="bold" font-family="Menlo, Monaco, monospace">RepairFailure.exhausted</text>
  <path d="M 400 429 L 640 429" fill="none" stroke="#f38ba8" stroke-width="2" marker-end="url(#arwR)"/>
  <text x="520" y="422" font-size="10" fill="#f38ba8" text-anchor="middle" font-family="Menlo, Monaco, monospace">budget spent</text>
  <rect x="640" y="300" width="190" height="72" rx="8" fill="#232634" stroke="#45475a" stroke-width="2"/>
  <text x="735" y="322" font-size="11" fill="#bac2de" text-anchor="middle" font-weight="bold" font-family="Menlo, Monaco, monospace">every step emits</text>
  <text x="735" y="340" font-size="10" fill="#9399b2" text-anchor="middle" font-family="Menlo, Monaco, monospace">RepairEvent →</text>
  <text x="735" y="356" font-size="10" fill="#9399b2" text-anchor="middle" font-family="Menlo, Monaco, monospace">RepairEventRecording</text>
  <text x="430" y="588" font-size="11" fill="#9399b2" text-anchor="middle" font-family="Menlo, Monaco, monospace">No compile-time dependency on ProviderGatewayKit or StructuredOutputKit — both plug in through protocol seams.</text>
</svg>